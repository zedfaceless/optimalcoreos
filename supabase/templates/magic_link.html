<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Optimal Core OS sign-in link</title>
  </head>
  <body style="margin:0;padding:0;background:#f5f6f8;">
    <!-- Magic links are not offered by any page in this app yet: sign-in is a password
         form. The template is here because the PRD lists four, and because a magic link
         sent with the stock template would land on a GoTrue page with no branding at all.
         The type is `magiclink`, which is the string GoTrue verifies the hash against. -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f6f8;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:16px;border:1px solid #e6e8ec;">
            <tr>
              <td style="padding:28px 28px 28px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
                <div style="font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#0f1b2e;">
                  Optimal Core OS
                </div>
                <h1 style="margin:16px 0 8px 0;font-size:22px;line-height:1.3;color:#0f1b2e;">
                  Sign in with one click
                </h1>
                <p style="margin:0 0 16px 0;font-size:15px;line-height:1.6;color:#4b5563;">
                  Use the button below to sign in to the console as
                  <strong>{{ .Email }}</strong>. The link works once and expires in an hour.
                </p>
                <p style="margin:0 0 24px 0;">
                  <a href="{{ .SiteURL }}/devside/auth/confirm?token_hash={{ .TokenHash }}&type=magiclink"
                     style="display:inline-block;background:#1d4ed8;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;padding:12px 20px;border-radius:10px;">
                    Sign in
                  </a>
                </p>
                <p style="margin:0;font-size:13px;line-height:1.6;color:#6b7280;">
                  If you did not ask for this link, no one can use it to reach your account without
                  also being on the console allowlist.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
